name: Validate deployment source

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Build Vercel frontend and bundled API
        run: npm run build:vercel

      - name: Verify bundled runtime is current
        shell: bash
        run: git diff --exit-code -- api/runtime.js

      - name: Wait for current Vercel Preview
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -u
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/ping"
          ready=0

          for attempt in $(seq 1 48); do
            CODE=$(curl -sS --max-time 20 -o /tmp/aura-ping-body.txt -D /tmp/aura-ping-headers.txt -w "%{http_code}" "$URL" || true)
            BODY=$(cat /tmp/aura-ping-body.txt 2>/dev/null || true)
            echo "Probe ${attempt}/48 HTTP=$CODE body=${BODY:0:300}"

            if [ "$CODE" = "200" ] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aura-ping-body.txt \
              && grep -Fq "$EXPECTED_SHA" /tmp/aura-ping-body.txt; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" != "1" ]; then
            echo "Preview did not reach the expected commit $EXPECTED_SHA"
            echo "--- headers ---"
            grep -iE '^(content-type|x-vercel-error|server|location):' /tmp/aura-ping-headers.txt || true
            echo "--- body ---"
            head -c 1200 /tmp/aura-ping-body.txt || true
            exit 1
          fi

      - name: Verify API ping
        shell: bash
        run: |
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/ping"
          CODE=$(curl -sS --max-time 20 -o /tmp/aura-final-ping.txt -w "%{http_code}" "$URL")
          cat /tmp/aura-final-ping.txt
          echo
          test "$CODE" = "200"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aura-final-ping.txt

      - name: Verify login reaches Neon
        shell: bash
        run: |
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/auth/login"
          CODE=$(curl -sS --max-time 30 \
            -o /tmp/aura-login-probe.txt \
            -w "%{http_code}" \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"username":"__aura_connectivity_probe__","password":"not-a-real-password"}' \
            "$URL")

          echo "HTTP_STATUS=$CODE"
          cat /tmp/aura-login-probe.txt
          echo
          test "$CODE" = "401"
          grep -Fq 'Credenciais inválidas' /tmp/aura-login-probe.txt

      - name: Verify frontend
        shell: bash
        run: |
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/"
          CODE=$(curl -sS --max-time 20 -o /tmp/aura-home.html -w "%{http_code}" "$URL")
          test "$CODE" = "200"
          grep -qi '<html' /tmp/aura-home.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: pipx install graphifyy

      - name: Update Graphify incrementally
        run: graphify update .

      - name: Commit refreshed graph to deployment branch
        shell: bash
        run: |
          if ! git diff --quiet -- graphify-out; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add graphify-out
            git commit -m "chore: refresh graphify [skip ci]"
            git push origin HEAD:deploy-vercel-neon-20260902
          fi

      - name: Package tracked source
        shell: bash
        run: git archive --format=tar.gz -o /tmp/aura-source.tgz HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-deploy-source
          path: /tmp/aura-source.tgz
          retention-days: 1
