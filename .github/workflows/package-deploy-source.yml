name: Validate Aura Preview

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Vercel build
        run: npm run build:vercel
      - name: Wait for Preview
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/ping"
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 20 -H 'User-Agent: AuraSistemas-CI/1.0' -H 'Cache-Control: no-cache' -o /tmp/ping.json -w "%{http_code}" "$URL" || true)
            cat /tmp/ping.json 2>/dev/null || true
            echo
            if [ "$CODE" = "200" ] && grep -Fq "$EXPECTED_SHA" /tmp/ping.json && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/ping.json; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: API ping
        run: |
          CODE=$(curl -sS --max-time 20 -H 'User-Agent: AuraSistemas-CI/1.0' -o /tmp/ping.json -w "%{http_code}" "https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/ping")
          test "$CODE" = "200"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/ping.json
      - name: Neon transactional product write
        run: |
          CODE=$(curl -sS --max-time 30 -H 'User-Agent: AuraSistemas-CI/1.0' -X POST -o /tmp/write.json -w "%{http_code}" "https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/__preview/product-write-selftest")
          cat /tmp/write.json
          echo
          test "$CODE" = "200"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/write.json
          grep -Eq '"rolledBack"[[:space:]]*:[[:space:]]*true' /tmp/write.json
      - name: Frontend
        run: |
          CODE=$(curl -sS --max-time 20 -H 'User-Agent: AuraSistemas-CI/1.0' -o /tmp/home.html -w "%{http_code}" "https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/")
          test "$CODE" = "200"
          grep -qi '<html' /tmp/home.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Graphify
        run: |
          pipx install graphifyy
          graphify update .
      - name: Refresh generated files
        shell: bash
        run: |
          if ! git diff --quiet -- api/runtime.js graphify-out; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/runtime.js graphify-out
            git commit -m "chore: refresh vercel bundle and graphify [skip ci]"
            git push origin HEAD:deploy-vercel-neon-20260902
          fi
