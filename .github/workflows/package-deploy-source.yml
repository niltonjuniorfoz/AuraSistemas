name: Validate deployment source

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply Vercel hardening
        run: node scripts/apply-vercel-hardening.cjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Vercel frontend build
        run: npm run build:vercel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: pipx install graphifyy

      - name: Update Graphify incrementally
        run: graphify update .

      - name: Commit hardened deployment branch
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: harden Vercel deployment [skip ci]"
            git push origin HEAD:deploy-vercel-neon-20260902
          fi

      - name: Package tracked source
        shell: bash
        run: git archive --format=tar.gz -o /tmp/aura-source.tgz HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-deploy-source
          path: /tmp/aura-source.tgz
          retention-days: 1
