name: Validate deployment source

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Vercel frontend build
        run: npm run build:vercel

      - name: Probe Vercel Preview API
        shell: bash
        run: |
          set -u
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/ping"
          CODE="000"
          rm -f /tmp/aura-ping-body.txt /tmp/aura-ping-headers.txt

          for attempt in $(seq 1 36); do
            echo "Probe attempt ${attempt}/36..."
            CODE=$(curl -sS \
              --max-time 15 \
              -o /tmp/aura-ping-body.txt \
              -D /tmp/aura-ping-headers.txt \
              -w "%{http_code}" \
              "$URL" || true)

            if [ "$CODE" != "000" ] && [ "$CODE" != "404" ]; then
              break
            fi
            sleep 5
          done

          echo "HTTP_STATUS=$CODE"
          echo "--- response headers ---"
          grep -iE '^(content-type|x-vercel-error|server|location):' /tmp/aura-ping-headers.txt || true
          echo "--- response body (first 1200 bytes) ---"
          head -c 1200 /tmp/aura-ping-body.txt || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "Preview API probe failed with HTTP $CODE"
            exit 1
          fi

          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aura-ping-body.txt; then
            echo "Preview API returned HTTP 200 but not the expected JSON payload."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: pipx install graphifyy

      - name: Update Graphify incrementally
        run: graphify update .

      - name: Commit refreshed graph to deployment branch
        shell: bash
        run: |
          if ! git diff --quiet -- graphify-out; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add graphify-out
            git commit -m "chore: refresh graphify [skip ci]"
            git push origin HEAD:deploy-vercel-neon-20260902
          fi

      - name: Package tracked source
        shell: bash
        run: git archive --format=tar.gz -o /tmp/aura-source.tgz HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-deploy-source
          path: /tmp/aura-source.tgz
          retention-days: 1
