name: Validate deployment source

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Vercel frontend build
        run: npm run build:vercel

      - name: Probe isolated Vercel imports
        shell: bash
        run: |
          set -u
          BASE="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app"
          failed=0

          # Wait until this deployment has reached the branch alias.
          for attempt in $(seq 1 36); do
            code=$(curl -sS --max-time 15 -o /tmp/diag-a.txt -w "%{http_code}" "$BASE/__diag/a" || true)
            if [ "$code" != "000" ] && [ "$code" != "404" ]; then
              break
            fi
            echo "Waiting for Vercel preview (${attempt}/36)..."
            sleep 5
          done

          for group in a b c d; do
            echo "=== DIAG GROUP $group ==="
            code=$(curl -sS --max-time 20 -o "/tmp/diag-$group.txt" -D "/tmp/diag-$group.headers" -w "%{http_code}" "$BASE/__diag/$group" || true)
            echo "HTTP_STATUS=$code"
            grep -iE '^(content-type|x-vercel-error|server|location):' "/tmp/diag-$group.headers" || true
            head -c 1200 "/tmp/diag-$group.txt" || true
            echo
            if [ "$code" != "200" ]; then
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            echo "One or more isolated import groups failed."
            exit 1
          fi

      - name: Probe Vercel Preview API
        shell: bash
        run: |
          set -u
          URL="https://aura-sistemas-git-deploy-vercel-neon-20260902-niltonjrfoz-5292.vercel.app/api/ping"
          CODE=$(curl -sS --max-time 20 -o /tmp/aura-ping-body.txt -D /tmp/aura-ping-headers.txt -w "%{http_code}" "$URL" || true)
          echo "HTTP_STATUS=$CODE"
          grep -iE '^(content-type|x-vercel-error|server|location):' /tmp/aura-ping-headers.txt || true
          head -c 1200 /tmp/aura-ping-body.txt || true
          echo
          if [ "$CODE" != "200" ]; then
            exit 1
          fi
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aura-ping-body.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: pipx install graphifyy

      - name: Update Graphify incrementally
        run: graphify update .

      - name: Commit refreshed graph to deployment branch
        shell: bash
        run: |
          if ! git diff --quiet -- graphify-out; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add graphify-out
            git commit -m "chore: refresh graphify [skip ci]"
            git push origin HEAD:deploy-vercel-neon-20260902
          fi

      - name: Package tracked source
        shell: bash
        run: git archive --format=tar.gz -o /tmp/aura-source.tgz HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-deploy-source
          path: /tmp/aura-source.tgz
          retention-days: 1
