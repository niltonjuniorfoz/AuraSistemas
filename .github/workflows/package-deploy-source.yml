name: Package deployment source

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: pipx install graphifyy

      - name: Update Graphify incrementally
        run: graphify update .

      - name: Commit refreshed graph to deployment branch
        shell: bash
        run: |
          if ! git diff --quiet -- graphify-out; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add graphify-out
            git commit -m "chore: refresh graphify [skip ci]"
            git push origin HEAD:deploy-vercel-neon-20260902
          fi

      - name: Package source
        shell: bash
        run: tar --exclude=.git --exclude=node_modules --exclude=aura-source.tgz -czf aura-source.tgz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-deploy-source
          path: aura-source.tgz
          retention-days: 1
