name: Apply storefront polish v2

on:
  push:
    branches:
      - storefront-polish-20260902

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, '[apply-storefront-polish-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/storefront_polish.py')
          source = path.read_text(encoding='utf-8')
          old = "related_pattern = r'      /\\* Relacionados \\*/"
          new = "related_pattern = r'      \\{/\\* Relacionados \\*/\\}"
          if old not in source:
              raise SystemExit('Padrão antigo de relacionados não encontrado no aplicador.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/storefront_polish.py

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Vercel production build
        run: npm run build:vercel

      - name: Refresh Graphify
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check graphifyy
          graphify . --update --no-viz

      - name: Commit tested storefront
        shell: bash
        run: |
          rm -f .github/storefront_polish.py
          rm -f .github/workflows/apply-storefront-polish.yml
          rm -f .github/workflows/apply-storefront-polish-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalizar experiência mobile da loja"
          git push origin HEAD:storefront-polish-20260902
