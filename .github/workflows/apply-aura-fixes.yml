name: Apply Aura fixes

on:
  push:
    branches:
      - deploy-vercel-neon-20260902

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-aura-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared fixes
        shell: bash
        run: |
          cat .github/aura-fixes.patch.part-* > /tmp/aura-fixes.patch
          git apply --check /tmp/aura-fixes.patch
          git apply /tmp/aura-fixes.patch
          rm -f .github/aura-fixes.patch.part-* .github/aura-fixes.patch.gz.b64.part-*
          rm .github/workflows/apply-aura-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persistência, Ollama e experiência visual"
          git push origin HEAD:deploy-vercel-neon-20260902
