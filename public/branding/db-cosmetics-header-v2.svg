<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">DB Cosmetics By Jessica Ferreira</title>
  <desc id="desc">Logo horizontal dourada com monograma DB em moldura oval vertical, Cosmetics e assinatura By Jessica Ferreira.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5ad3c"/>
      <stop offset="0.42" stop-color="#a57908"/>
      <stop offset="0.72" stop-color="#8f6500"/>
      <stop offset="1" stop-color="#c69a25"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#6f4d00" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Moldura mais alta e estreita, seguindo a proporção oval da marca original. -->
  <g fill="none" stroke="url(#gold)" filter="url(#softShadow)">
    <rect x="30" y="10" width="122" height="184" rx="61" stroke-width="3.2"/>
    <rect x="36" y="17" width="110" height="170" rx="55" stroke-width="1.7" opacity="0.96"/>
  </g>

  <g fill="url(#gold)" filter="url(#softShadow)" font-family="Georgia, 'Times New Roman', serif">
    <text x="49" y="132" font-size="91" letter-spacing="-9">D</text>
    <text x="91" y="151" font-size="76" letter-spacing="-8">B</text>
    <text x="10" y="238" font-size="31" letter-spacing="1.7">COSMETICS</text>
  </g>

  <g filter="url(#softShadow)">
    <line x1="190" y1="56" x2="190" y2="176" stroke="#bb8d1d" stroke-width="1.2" opacity="0.42"/>
    <text x="226" y="119" fill="#9b7000" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="600" letter-spacing="0.1">By Jessica Ferreira.</text>
    <text x="229" y="151" fill="#9f854d" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.1">BELEZA • CUIDADO • ESSÊNCIA</text>
  </g>
</svg>
