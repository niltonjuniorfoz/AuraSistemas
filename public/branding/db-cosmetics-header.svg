<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">DB Cosmetics By Jessica Ferreira</title>
  <desc id="desc">Logo horizontal dourada com monograma DB, Cosmetics e assinatura By Jessica Ferreira.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#6f4d00" flood-opacity=".20"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ad38"/>
      <stop offset=".46" stop-color="#9b7000"/>
      <stop offset="1" stop-color="#c79a21"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" filter="url(#shadow)">
    <rect x="25" y="13" width="138" height="166" rx="68" stroke-width="3"/>
    <rect x="31" y="19" width="126" height="154" rx="62" stroke-width="1.6" opacity=".92"/>
  </g>
  <g fill="url(#gold)" filter="url(#shadow)" font-family="Georgia, 'Times New Roman', serif">
    <text x="48" y="129" font-size="92" letter-spacing="-9">D</text>
    <text x="92" y="147" font-size="76" letter-spacing="-8">B</text>
    <text x="12" y="221" font-size="31" letter-spacing="1.8">COSMETICS</text>
  </g>
  <g filter="url(#shadow)">
    <line x1="205" y1="62" x2="205" y2="178" stroke="#caa035" stroke-width="1" opacity=".34"/>
    <text x="240" y="118" fill="#9b7000" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing=".25">By Jessica Ferreira.</text>
    <text x="241" y="145" fill="#a98d5b" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3.4">BELEZA • CUIDADO • ESSÊNCIA</text>
  </g>
</svg>
